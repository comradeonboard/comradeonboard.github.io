# Render Blueprint: Web Service for the portfolio.
# No dependencies: the build step copies the site into dist/, and server.py
# serves that folder on the port Render provides.
services:
  - type: web
    name: comradeonboard
    runtime: python
    plan: free
    repo: https://github.com/comradeonboard/comradeonboard.github.io
    branch: main
    buildCommand: mkdir -p dist && cp -r *.html *.xml *.txt media styles.css script.js dist/
    startCommand: python3 server.py
    autoDeployTrigger: commit
